];let projects=loadProjects();let state={route:'home',category:'All',query:'',sort:'popular',tag:'',detail:null,dashTab:'projects'};const app=document.getElementById('app'),overlay=document.getElementById('overlay');function loadProjects(){try{const saved=JSON.parse(localStorage.getItem(KEY));return Array.isArray(saved)&&saved.length?saved:seed.map(x=>({...x}));}catch(e){return seed.map(x=>({...x}))}}function persist(){localStorage.setItem(KEY,JSON.stringify(projects))}function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function format(n){return new Intl.NumberFormat('en',{notation:n>=1000?'compact':'standard',maximumFractionDigits:1}).format(n)}function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)}function setRoute(route){state.route=route;state.detail=null;state.category='All';render();window.scrollTo(0,0);document.getElementById('navlinks').classList.remove('open')}function card(p){return `<article class="project-card" data-open="${safe(p.id)}"><div class="card-cover" style="background-image:url('${safe(p.banner)}')">${p.featured?'<span class="badge">Featured</span>':p.trending?'<span class="badge purple">Trending</span>':''}</div><div class="card-content"><div class="card-title-row"><img class="project-icon" src="${safe(p.icon)}" alt=""><div style="min-width:0"><div class="project-name">${safe(p.name)}</div><div class="creator">by ${safe(p.creator)}</div></div></div><p class="card-desc">${safe(p.description)}</p><div class="tag-row">${(p.tags||[]).slice(0,2).map(t=>`<span class="tag">${safe(t)}</span>`).join('')}</div><div class="card-footer"><span>⬇ ${format(p.downloads)}</span><span class="stars">★ ${Number(p.rating||0).toFixed(1)}</span><span>${safe(p.category)}</span></div></div></article>`}function section(title,sub,list,allRoute='browse'){if(!list.length)return '';retur function browse(){let list=projects.filter(p=>{const q=state.query.toLowerCase();return(state.category==='All'||p.category===state.category)&&(!state.tag||p.tags?.includes(state.tag))&&(!q||[p.name,p.creator,p.category,p.description,...(p.tags||[])].join(' ').toLowerCase().includes(q))});if(state.sort==='popular')list.sort((a,b)=>b.downloads-a.downloads);if(state.sort==='rating')list.sort((a,b)=>b.rating-a.rating);if(state.sort==='recent')list.reverse();return `<div class="container browse-layout"><aside class="filters"><div class="filter-head">Filters <button class="btn-quiet" id="clearFilters">Clear</button></div><div class="filter-contents"><div class="filter-group"><h4>Category</h4>${['All',...categories].map(c=>`<label class="filter-item"><input type="radio" name="category" value="${safe(c)}" ${state.category===c?'checked':''}> ${c}</label>`).join('')}</div><div class="filter-group"><h4>Discover</h4>${[['Featured','featured'],['Trending','trending']].map(([c,k])=>`<label class="filter-item"><input type="checkbox" data-flag="${k}" ${state[k]?'checked':''}> ${c} projects</label>`).join('')}</div><div class="filter-group"><h4>Top tags</h4>${['Adventure','Visuals','QoL','Building','Survival'].map(t=>`<label class="filter-item"><input type="checkbox" data-tag="${t}" ${state.tag===t?'checked':''}> ${t}</label>`).join('')}</div></div></aside><div><div class="section-head"><div><h1 class="section-title">Explore projects</h1><p class="section-sub">Find your next favorite community creation.</p></div></div><div class="sort-row"><span class="result-count" id="resultCount">${list.length} projects</span><select id="sortSelect" aria-label="Sort projects"><option value="popular" ${state.sort==='popular'?'selected':''}>Most popular</option><option value="recent" ${state.sort==='recent'?'selected':''}>Recently updated</option><option value="rating" ${state.sort==='rating'?'selected':''}>Highest rated</option></select></div><div class="project-grid" id="browseGrid">${list.map(ca function detail(p){const comments=JSON.parse(localStorage.getItem(COMMENTS)||'{}')[p.id]||[{name:'BlockBard',text:'Fantastic project. This has completely changed my latest world!'}, {name:'Juniper',text:'Really thoughtful details and great performance. Highly recommended.'}];return `<div class="container detail-wrap"><a class="back-link" data-route="browse">← Back to projects</a><div class="detail-banner" style="background-image:url('${safe(p.banner)}')"></div><div class="detail-main"><img class="project-icon" src="${safe(p.icon)}" alt=""><div><h1 class="detail-title">${safe(p.name)}</h1><div class="detail-byline">by <b>${safe(p.creator)}</b> · ${safe(p.category)} · <span class="stars">★ ${Number(p.rating||0).toFixed(1)}</span></div></div><div class="detail-actions"><button class="btn btn-soft" id="favoriteBtn">♡ Save</button><button class="btn btn-primary" id="downloadBtn">⬇ Download</button></div></div><div class="detail-layout"><div><section class="detail-panel"><h3>About this project</h3><div class="detail-copy">${safe(p.description)}</div><div class="tag-row" style="margin-top:16px">${(p.tags||[]).map(t=>`<span class="tag">${safe(t)}</span>`).join('')}</div></section><section class="detail-panel"><h3>Screenshots</h3><div class="gallery">${(p.screens||[]).map(src=>`<img src="${safe(src)}" alt="${safe(p.name)} screenshot" data-image="${safe(src)}">`).join('')}</div></section><section class="detail-panel"><h3>What's new</h3><div class="detail-copy" style="white-space:pre-line">${safe(p.changelog||'Initial release — explore and enjoy!')}</div></section><section class="detail-panel"><h3>Community comments</h3><div id="commentsList">${comments.map(c=>`<div class="comment"><b>${safe(c.name)}</b><p>${safe(c.text)}</p></div>`).join('')}</div><form class="comment-form" id="commentForm"><input class="form-control" name="comment" required placeholder="Share your thoughts..."><button class="btn btn-primary">Post</button></form></section></div><aside><section class="detail-panel"><h3>Project details</h3><div class="info-row"><span>Downloads</span><b>⬇ ${format(p.downloads)}</b></div><div class="info-row"><span>Rating</span><b class="stars">★ ${Number(p.rating||0).toFixed(1)}</b></div><div class="info-row"><span>Category</span><b>${safe(p.category)}</b></div><div class="info-row"><span>Updated</span><b>${safe(p.updated||'Recently')}</b></div></section><section class="detail-panel"><h3>Files</h3><div class="version-box"><div><b>${safe(p.name)} · ${safe(p.version||'1.0.0')}</b><small>Latest release · ${safe(p.category)}</small></div><button class="btn btn-primary" id="downloadBtn2">⬇</button></div><p style="font-size:11px;color:var(--muted)">Check the project description for compatibility details.</p></section><section class="detail-panel"><h3>More from ${safe(p.creator)}</h3>${projects.filter(x=>x.creator===p.creator&&x.id!==p.id).slice(0,3).map(x=>`<div class="mini-project" style="margin:8px 0" data-open="${safe(x.id)}"><img src="${safe(x.icon)}"><div><b>${safe(x.name)}</b><small>${format(x.downloads)} downloads</small></div></div>`).join('')||'<p style="color:var(--muted)">More projects coming soon.</p>'}</section></aside></div></div>`}
function dashboard(){const own=projects.filter(p=>p.owner==='local');const downloads=own.reduce((a,p)=>a+p.downloads,0);return `<div class="container dashboard"><div class="dash-head"><div><span class="eyebrow">Creator studio</span><h1>Manage your projects</h1><p class="section-sub">Build your page, share your work, and grow your community.</p></div><button class="btn btn-primary" id="createProject">＋ Create project</button></div><div class="stats" style="margin-bottom:25px"><div class="stat"><b>${own.length}</b><span>Your projects</span></div><div class="stat"><b>${format(downloads)}</b><span>Total downloads</span></div><div class="stat"><b>${own.length?((own.reduce((a,p)=>a+(p.rating||0),0)/own.length).toFixed(1)):'—'}</b><span>Average rating</span></div><div class="stat"><b>Ready</b><span>Creator status</span></div></div><div class="dash-tabs"><button class="dash-tab ${state.dashTab==='projects'?'active':''}" data-dashtab="projects">My projects</button><button class="dash-tab ${state.dashTab==='files'?'active':''}" data-dashtab="files">File library</button><button class="dash-tab ${state.dashTab==='analytics'?'active':''}" data-dashtab="analytics">Analytics</button></div>${state.dashTab==='projects'?`<div class="detail-panel" style="padding:8px 17px;overflow:auto"><table class="dash-table"><thead><tr><th>Project</th><th>Status</th><th>Downloads</th><th>Rating</th><th>Actions</th></tr></thead><tbody>${own.length?own.map(p=>`<tr><td><div class="dash-project"><img src="${safe(p.icon)}"><div><b>${safe(p.name)}</b><div class="creator">${safe(p.category)}</div></div></div></td><td><span style="color:var(--lime)">● Published</span></td><td>${format(p.downloads)}</td><td class="stars">★ ${Number(p.rating||0).toFixed(1)}</td><td><div class="table-actions"><button class="icon-btn" data-edit="${safe(p.id)}">Edit</button><button class="icon-btn" data-open="${safe(p.id)}">View</button><button class="icon-btn" data-delete="${safe(p.id)}" aria-label="Delete project">✕</button>< function openProject(id){if(!projects.some(p=>p.id===id))return;state.detail=id;state.route='detail';render();window.scrollTo(0,0)}function fileToData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
function showProjectForm(id){const p=projects.find(x=>x.id===id);overlay.innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>${p?'Edit project':'Create a project'}</h2><button class="close-btn" data-close>✕</button></div><form id="projectForm"><div class="form-grid"><div class="field"><label>Project name *</label><input class="form-control" name="name" required maxlength="60" value="${safe(p?.name||'')}"></div><div class="field"><label>Category *</label><select class="form-control" name="category">${categories.map(c=>`<option ${p?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field full"><label>Description *</label><textarea class="form-control" name="description" required maxlength="600">${safe(p?.description||'')}</textarea></div><div class="field"><label>Tags (comma separated)</label><input class="form-control" name="tags" value="${safe((p?.tags||[]).join(', '))}" placeholder="Adventure, QoL"></div><div class="field"><label>Game version</label><input class="form-control" name="version" value="${safe(p?.version||'1.21.4')}" placeholder="1.21.4"></div><div class="field"><label>Project banner image</label><input class="form-control" type="file" name="banner" accept="image/*"></div><div class="field"><label>Project icon</label><input class="form-control" type="file" name="icon" accept="image/*"></div><div class="field full"><label>Changelog</label><textarea class="form-control" name="changelog" placeholder="What's new in this release?">${safe(p?.changelog||'')}</textarea></div><div class="field full"><label>Upload screenshots (optional)</label><input class="form-control" type="file" name="screens" accept="image/*" multiple></div></div><div class="modal-actions"><button type="button" class="btn btn-soft" data-close>Cancel</button><button class="btn btn-primary">${p?'Save changes':'Publish project'}</button></div></form></div></div>`;overlay.classList.remove('hidden')}
async function saveProject(form){const fd=new FormData(form),id=projects.find(p=>p.id===state.detail)?.id||form.dataset.edit;const existing=projects.find(p=>p.id===id);const bannerFile=fd.get('banner'),iconFile=fd.get('icon'),screenFiles=Array.from(form.elements.screens.files||[]);let screens=existing?.screens||[];if(screenFiles.length)screens=await Promise.all(screenFiles.slice(0,6).map(fileToData));const project={...(existing||{}),id:id||'p-'+Date.now(),name:fd.get('name').trim(),creator:existing?.creator||'You',owner:'local',category:fd.get('category'),description:fd.get('description').trim(),tags:String(fd.get('tags')||'').split(',').map(s=>s.trim()).filter(Boolean),version:fd.get('version')||'1.0.0',changelog:fd.get('changelog')||'Initial release',banner:bannerFile?.size?await fileToData(bannerFile):existing?.banner||img('photo-1511512578047-dfb367046420'),icon:iconFile?.size?await fileToData(iconFile):existing?.icon||img('photo-1498050108023-c5249f4df085',180),screens: screens.length?screens:[img('photo-1511512578047-dfb367046420',700)],downloads:existing?.downloads||0,rating:existing?.rating||0,updated:'Just now',featured:existing?.featured||false,trending:existing?.trending||false};if(existing)projects=projects.map(p=>p.id===id?project:p);else projects.unshift(project);persist();overlay.innerHTML='';overlay.classList.add('hidden');state.route='dashboard';state.detail=null;render();toast(existing?'Project updated successfully!':'Your project is live!')}
app.addEventListener('click',e=>{const route=e.target.closest('[data-route]')?.dataset.route;if(route){e.preventDefault();setRoute(route);return}const cat=e.target.closest('[data-category]')?.dataset.category;if(cat){state.route='browse';state.category=cat;render();window.scrollTo(0,0);return}const open=e.target.closest('[data-open]')?.dataset.open;if(open){openProject(open);return}const edit=e.target.closest('[data-edit]')?.dataset.edit;if(edit){showProjectForm(edit);return}const del=e.target.closest('[data-delete]')?.dataset.delete;if(del){const p=projects.find(x=>x.id===del);if(confirm(`Delete “${p.name}”? This cannot be undone.`)){projects=projects.filter(x=>x.id!==del);persist();render();toast('Project deleted.')}return}if(e.target.closest('[data-close]')){overlay.innerHTML='';overlay.classList.add('hidden');return}if(e.target.id==='createProject'||e.target.id==='createProject2'){showProjectForm();return}if(e.target.id==='clearFilters'){state.category='All';state.tag='';state.featured=false;state.trending=false;render();return}if(e.target.id==='downloadBtn'||e.target.id==='downloadBtn2'){const p=projects.find(x=>x.id===state.detail);if(p){p.downloads++;persist();render();toast('Your download is ready! (Demo download tracked)')}return}if(e.target.id==='favoriteBtn'){e.target.textContent=e.target.textContent.includes('♡')?'♥ Saved':'♡ Save';e.target.style.color='var(--lime)';return}const shot=e.target.closest('[data-image]');if(shot){overlay.innerHTML=`<div class="modal-backdrop" data-close><img src="${safe(shot.dataset.image)}" style="max-width:90vw;max-height:85vh;border-radius:12px"></div>`;overlay.classList.remove('hidden');return}const tab=e.target.closest('[data-dashtab]')?.dataset.dashtab;if(tab){state.dashTab=tab;render()}});
app.addEventListener('change',e=>{if(e.target.name==='category'){state.category=e.target.value;render()}if(e.target.id==='sortSelect'){state.sort=e.target.value;render()}if(e.target.dataset.flag){state[e.target.dataset.flag]=e.target.checked;render()}if(e.target.dataset.tag){state.tag=e.target.checked?e.target.dataset.tag:'';render()}});app.addEventListener('submit',async e=>{if(e.target.id==='projectForm'){e.preventDefault();await saveProject(e.target)}if(e.target.id==='commentForm'){e.preventDefault();const p=projects.find(x=>x.id===state.detail),text=new FormData(e.target).get('comment').trim();if(!text)return;const all=JSON.parse(localStorage.getItem(COMMENTS)||'{}');all[p.id]=[...(all[p.id]||[]),{name:'You',text}];localStorage.setItem(COMMENTS,JSON.stringify(all));render();toast('Comment posted!')}});overlay.addEventListener('submit',async e=>{if(e.target.id==='projectForm'){e.preventDefault();await saveProject(e.target)}});document.getElementById('globalSearch').addEventListener('input',e=>{state.query=e.target.value;if(state.route!=='browse'){state.route='browse';state.detail=null}render();const input=document.getElementById('globalSearch');input.focus();input.setSelectionRange(input.value.length,input.value.length)});document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){state.query=e.target.value;setRoute('browse')}});document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('navlinks').classList.toggle('open'));document.addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop')){overlay.innerHTML='';overlay.classList.add('hidden')}});document.addEventListener('click',async e=>{if(e.target.id==='uploadFile'){const file=document.getElementById('fileUpload')?.files[0],message=document.getElementById('fileMessage');if(!file){toast('Choose a file to upload first.');return}const id=document.getElementById('fileProject').value,proj=projects.find(p=>p.id===id);if(!proj){toast('Create a project before uploading files.');return}const files=JSON.parse(localStorage.getItem('lootly-files-v1')||'{}');files[id]=[...(files[id]||[]),{name:file.name,size:file.size,version:document.getElementById('fileVersion').value||proj.version,uploaded:new Date().toLocaleDateString()}];localStorage.setItem('lootly-files-v1',JSON.stringify(files));message.textContent=`${file.name} uploaded for ${proj.name}.`;toast('File uploaded!')}});render();
